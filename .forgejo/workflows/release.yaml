name: Release

# Every push to main publishes the image as main-<sha>-<unix time>. A push whose
# newest CHANGELOG.md entry names an untagged version also cuts that version:
# the tag, the image as X.Y.Z and latest, the Helm chart, and .deb packages for
# amd64 and arm64 in the owner's Debian registry and on the release.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

# The automatic token cannot write packages owned by a user, so registry access
# trades an OIDC token for an Authorized Integration of the owner's, selected
# by REGISTRY_AUDIENCE and scoped write:package.
enable-openid-connect: true

env:
  REGISTRY: sarak.sh
  REGISTRY_AUDIENCE: u:1:62e83a47-a7dc-4f1e-9075-57e5a37b8449
  IMAGE: sarak.sh/${{ github.repository }}
  CHART_REPOSITORY: oci://sarak.sh/${{ github.repository_owner }}/charts
  DEBIAN_DISTRIBUTION: trixie
  DEBIAN_COMPONENT: main

jobs:
  ci:
    uses: ./.forgejo/workflows/ci.yaml

  plan:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.changelog.outputs.due }}
      version: ${{ steps.changelog.outputs.version }}
      notes: ${{ steps.changelog.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changelog
        uses: https://sarak.sh/mikluko/changelog@v1
        with:
          error: prerelease-entry

  image:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install ko
        run: go install github.com/google/ko@v0.19.1
      - name: Log in
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$REGISTRY_AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          printf '%s' "$jwt" | "$(go env GOPATH)/bin/ko" login "$REGISTRY" --username oidc --password-stdin
      - name: Build and push
        env:
          DUE: ${{ needs.plan.outputs.due }}
          RELEASE: ${{ needs.plan.outputs.version }}
          KO_DOCKER_REPO: ${{ env.IMAGE }}
        run: |
          tags=main-${GITHUB_SHA::7}-$(date +%s)
          export VERSION=dev-${GITHUB_SHA::7}
          if [ "$DUE" = true ]; then
            export VERSION=$RELEASE
            tags=$tags,$RELEASE,latest
          fi
          "$(go env GOPATH)/bin/ko" build --bare --tags "$tags" --platform linux/amd64,linux/arm64 \
            --image-label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --image-label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --image-label "org.opencontainers.image.version=$VERSION" \
            .

  packages:
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          for GOARCH in amd64 arm64; do
            export GOARCH
            CGO_ENABLED=0 GOOS=linux go build -trimpath \
              -ldflags="-s -X main.version=$VERSION" \
              -o dist/jmap-mcp .
            "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm.yaml --packager deb --target dist/
          done
          ls -l dist/*.deb
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
      - name: Upload to the Debian registry
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$REGISTRY_AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          owner=${GITHUB_REPOSITORY%%/*}
          for deb in dist/*.deb; do
            curl --fail-with-body -sS -X PUT -H "Authorization: Bearer $jwt" --upload-file "$deb" \
              "$GITHUB_SERVER_URL/api/packages/$owner/debian/pool/$DEBIAN_DISTRIBUTION/$DEBIAN_COMPONENT/upload"
          done

  chart:
    needs: [plan, image]
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: https://github.com/azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Log in
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$REGISTRY_AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          printf '%s' "$jwt" | helm registry login "$REGISTRY" --username oidc --password-stdin
      - name: Package and push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          helm package charts/jmap-mcp --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/chart"
          helm push "$RUNNER_TEMP/chart/jmap-mcp-$VERSION.tgz" "$CHART_REPOSITORY"

  # Last, so the tag exists only once everything it names does.
  release:
    needs: [plan, image, chart, packages]
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.plan.outputs.version }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          id=$(jq -n --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg body "$NOTES" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $body}' |
            curl --fail-with-body -sS -X POST \
              -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
              -d @- "$api/releases" | jq -r .id)
          for deb in dist/*.deb; do
            curl --fail-with-body -sS -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$deb" "$api/releases/$id/assets?name=$(basename "$deb")" >/dev/null
          done
          echo "Released **$TAG**." >>"$GITHUB_STEP_SUMMARY"
